name: Coin Drop offline checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coin-drop-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci --prefix web
      - name: Run offline YES DROP tests
        run: npm run check --prefix web
