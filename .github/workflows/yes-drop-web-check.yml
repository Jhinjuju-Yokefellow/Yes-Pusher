name: YES DROP web regression
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/yes-drop-web-check.yml"
  workflow_dispatch:

jobs:
  web-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Run JavaScript syntax and offline regression tests
        working-directory: web
        run: npm run check
