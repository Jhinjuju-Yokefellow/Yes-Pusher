<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="blueField" cx="38%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#208cff"/>
      <stop offset="34%" stop-color="#075fdc"/>
      <stop offset="72%" stop-color="#06348f"/>
      <stop offset="100%" stop-color="#031a55"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="18%" stop-color="#aab5c2"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#768391"/>
      <stop offset="74%" stop-color="#eef4fa"/>
      <stop offset="100%" stop-color="#8a96a3"/>
    </linearGradient>
    <linearGradient id="silverText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e7edf3"/>
      <stop offset="100%" stop-color="#8d99a6"/>
    </linearGradient>
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="4" flood-color="#00133d" flood-opacity="0.95"/>
    </filter>
    <clipPath id="coinClip"><circle cx="256" cy="256" r="250"/></clipPath>
  </defs>

  <g clip-path="url(#coinClip)">
    <circle cx="256" cy="256" r="250" fill="#758291"/>
    <circle cx="256" cy="256" r="246" fill="url(#silver)"/>
    <circle cx="256" cy="256" r="224" fill="#0a49c7" filter="url(#blueGlow)"/>
    <circle cx="256" cy="256" r="215" fill="url(#silver)"/>
    <circle cx="256" cy="256" r="195" fill="#001e61"/>
    <circle cx="256" cy="256" r="187" fill="url(#blueField)"/>
    <circle cx="256" cy="256" r="188" fill="none" stroke="#22a2ff" stroke-width="5" filter="url(#blueGlow)"/>
    <circle cx="256" cy="256" r="224" fill="none" stroke="#1e7dff" stroke-width="5" filter="url(#blueGlow)"/>

    <text x="256" y="302"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="150"
      font-weight="900"
      letter-spacing="-8"
      fill="url(#silverText)"
      stroke="#f8fbff"
      stroke-width="2.5"
      paint-order="stroke fill"
      filter="url(#textShadow)">YES</text>

    <ellipse cx="194" cy="110" rx="116" ry="45" fill="#5ab5ff" opacity="0.18"/>
  </g>
</svg>