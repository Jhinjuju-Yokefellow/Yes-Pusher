[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web.yd2"
watchPatterns = [
  "Dockerfile.web.yd2",
  "railway.web.toml",
  "project.godot",
  "export_presets.cfg",
  "*.tscn",
  "scripts/**",
  "assets/**",
  "web/**"
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
